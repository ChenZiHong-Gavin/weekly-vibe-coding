  <style>

    .burner { position:absolute; left:488px; top:251px; width:484px; height:484px; border:1px solid #ae946e44; border-radius:50%; box-shadow:inset 0 0 0 23px #c5af8844; } .grate { position:absolute; inset:45px; border:10px solid #514e3d; border-radius:50%; box-shadow:0 5px 4px #59402633,inset 0 1px #9b9276; } .grate::before,.grate::after { content:""; position:absolute; top:47%; left:-43px; right:-43px; height:13px; border-radius:2px; background:#4d4c3a; transform:rotate(40deg); } .grate::after { transform:rotate(-40deg); }
    .pot { position:absolute; left:527px; top:290px; width:406px; height:406px; border:15px solid #414a37; border-radius:50%; background:#353e31; box-shadow:inset 0 0 0 2px #a7a277,0 15px 16px #513b2340,0 0 0 2px #8d9067; padding:11px; z-index:2; } .pot::before,.pot::after { content:""; position:absolute; top:159px; width:59px; height:55px; border:11px solid #414a37; border-radius:15px; z-index:-1; box-shadow:0 4px 4px #513b2322; } .pot::before { left:-66px; } .pot::after { right:-66px; } .pot img { width:100%; height:100%; border-radius:50%; filter:saturate(.8) sepia(.12); } .pot .rim { position:absolute; inset:11px; border:2px solid #bdad7d88; border-radius:50%; box-shadow:inset 0 0 15px #111a; }
    .steam { position:absolute; left:662px; top:250px; width:158px; height:156px; z-index:3; color:#f5eddb; opacity:.85; } .pot-label { position:absolute; left:664px; top:217px; font:15px var(--hand); color:var(--sage); transform:rotate(3deg); } .pot-label span { margin-right:8px; color:var(--red); } .pot-name { position:absolute; top:706px; left:548px; width:364px; text-align:center; font:20px var(--hand); } .pot-name small { color:var(--muted); font:10px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; margin-right:13px; }
    .cloth { position:absolute; left:1037px; top:302px; width:315px; height:338px; transform:rotate(8deg); background:repeating-linear-gradient(0deg,#f4ecdb66 0 3px,#d9cdb566 3px 4px),repeating-linear-gradient(90deg,#f4ecdb66 0 3px,#d9cdb566 3px 4px),#e4d9c2; border:1px solid #c0ad8e; box-shadow:2px 4px 6px #513b2314; }
    .plate { position:absolute; left:1052px; top:336px; width:280px; height:280px; border:1px solid #b8af9a; border-radius:50%; padding:30px; background:#f8f3e5; box-shadow:inset 0 0 0 9px #f8f3e5,inset 0 0 0 10px #d4c8ac,inset 0 0 0 24px #f8f3e5,inset 0 0 0 25px #ddd4bd,3px 10px 11px #513b2336; } .plate img { width:100%; height:100%; border-radius:50%; } .plate-title { position:absolute; top:231px; left:1052px; font:28px var(--serif); transform:rotate(-3deg); } .plate-title small { display:block; margin-bottom:9px; color:var(--red); font:15px var(--hand); }
    .serve-arrow { position:absolute; top:376px; left:938px; width:113px; height:89px; color:#79684e; } .serve-note { position:absolute; left:1004px; top:484px; writing-mode:vertical-rl; font:14px var(--hand); letter-spacing:.15em; color:#79684e; }
    .save { position:absolute; top:661px; left:1091px; width:197px; height:42px; border:1px solid #687254; border-radius:3px; color:#fbf4e4; background:#657054; font:16px var(--hand); box-shadow:1px 3px 0 #a18e6f; transform:rotate(-2deg); }
    .return-tag { position:absolute; left:1041px; top:727px; width:300px; padding:15px 14px 16px; border:1px solid #d8cdb4; background:#f1e8d4; box-shadow:2px 5px 6px #513b231f; color:var(--red); text-align:center; transform:rotate(4deg); } .return-tag::before { content:""; position:absolute; left:16px; top:15px; width:6px; height:6px; border-radius:50%; border:1px solid #bdac8d; } .return-tag button { border:0; background:transparent; color:var(--red); font:19px var(--hand); } .return-tag small { display:block; margin-top:4px; color:#79684e; font:13px var(--hand); }
    .again { position:absolute; left:1114px; top:835px; border:0; padding:4px; background:transparent; color:#675a43; font:16px var(--hand); }
    .heat { position:absolute; left:543px; top:769px; display:flex; gap:22px; } .heat button { border:0; background:transparent; color:#7b6a4e; font:12px var(--hand); text-align:center; padding:0; width:86px; } .flames { height:27px; display:flex; align-items:center; justify-content:center; gap:2px; margin-bottom:6px; } .flames svg { width:15px; height:23px; } .heat .selected { color:var(--red); } .heat .selected span:last-child { border-bottom:1px solid var(--red); padding-bottom:4px; }
    .methods { position:absolute; left:508px; top:860px; display:flex; gap:22px; } .method { width:53px; padding:0; border:0; background:transparent; color:#716144; font:16px var(--serif); } .method svg { width:43px; height:33px; margin:0 auto 7px; } .method.selected { color:var(--red); } .method.selected::after { content:""; display:block; width:21px; height:1px; margin:5px auto; background:var(--red); }
    .switch { position:absolute; left:922px; top:804px; width:66px; height:66px; border:2px solid #a58e6d; border-radius:50%; background:linear-gradient(140deg,#b56447,#8c3d2b); box-shadow:inset 0 0 0 5px #b56346,1px 5px 0 #977c58,3px 8px 8px #513b2333; color:#f9ead1; font:16px var(--serif); } .switch-label { position:absolute; top:885px; left:893px; width:122px; text-align:center; color:#79684e; font:11px var(--hand); }
    .history { position:absolute; left:1081px; top:900px; display:flex; gap:14px; align-items:center; } .history img { width:41px; height:41px; padding:5px; background:#f8f3e5; border-radius:50%; box-shadow:1px 3px 4px #513b2322; } .history button { padding:0; background:transparent; border:0; color:#79684e; font:13px var(--hand); }
    footer { position:absolute; bottom:18px; left:60px; right:60px; display:flex; justify-content:space-between; color:#7c6b51; font:9px monospace; letter-spacing:.12em; } .defs { position:absolute; width:0; height:0; overflow:hidden; }
  </style>
</head>
<body>
  <main class="page" aria-label="记忆厨房，俯视灶台静态示意">
    <div class="version"><span><b>V2 · 摊开一张灶台</b>把操作变成手边的厨具，在一张真实桌面上完成一顿记忆。</span><span>STATIC STUDY / 1440 × 1000</span></div>
    <svg class="defs" aria-hidden="true"><defs><symbol id="flame" viewBox="0 0 24 32"><path d="M12 1C14 11 3 10 4 21c1 15 22 12 17-3-1-4-4-6-4-9-1 5-4 7-5 7C7 12 16 8 12 1Z" fill="currentColor"/></symbol></defs></svg>
    <header><div class="brand"><h1>记忆厨房</h1><span>把照片摊开，像在家里做一顿饭。</span></div><button type="button" class="settings" aria-label="灶台设置，生图接口"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6 3v18M12 3v18M18 3v18M3 8h6m0 8h6m0-9h6"/></svg>灶台设置</button></header>
    <p class="work-note">一日三餐 · 记忆手帖 / 第 004 锅</p><p class="clock">晚一些也没关系，厨房还亮着灯。</p>
    <div class="board" aria-hidden="true"></div><button type="button" class="upload">＋ 挑照片 / 拖到案板上 <small>3 / 5 · 可多选</small></button><p class="drag-note">往锅里放 ↘</p>
    <figure class="photo photo-a"><img src="assets/backlit.jpg" alt="长辈在窗边为孩子整理头巾"><figcaption>窗边的午后<small>切片 · 适量 · 牵挂</small></figcaption></figure>
    <figure class="photo photo-b"><img src="assets/kid.jpg" alt="围着彩色围巾的孩子开心地笑"><figcaption>第一口笑<small>捣碎 · 少许 · 甜</small></figcaption></figure>
    <figure class="photo photo-c"><img src="assets/lowkey.jpg" alt="房间里的孩子和一道窗光"><figcaption>那束光<small>腌制 · 大量 · 安静</small></figcaption></figure>
    <aside class="selected-note" aria-label="当前选中的食材"><p>这一味：窗边的午后 <button type="button" class="text-btn">改名 ↗</button></p><small>味道：牵挂 <button type="button" class="text-btn">写一个词 ↗</button></small></aside>
    <section class="tools" aria-label="用厨具选择处理方式">
      <button type="button" class="tool selected" aria-pressed="true"><svg viewBox="0 0 120 75" aria-hidden="true"><path d="m12 48 62-29 8 19-59 29Z" fill="#d4d2bc" stroke="#8e927e"/><path d="m74 19 28-13q6-2 8 4l5 12q2 5-4 7L82 40Z" fill="#6d4931" stroke="#553e2e"/><circle cx="95" cy="20" r="2" fill="#b9a77d"/><path d="m14 49 12 14 55-26" fill="none" stroke="#f4edda"/></svg>切片</button>
      <button type="button" class="tool" aria-pressed="false"><svg viewBox="0 0 120 75" aria-hidden="true"><ellipse cx="59" cy="42" rx="34" ry="13" fill="#aca183"/><path d="M25 42q0 31 34 31t34-31" fill="#bcb294" stroke="#8b8266"/><ellipse cx="59" cy="42" rx="30" ry="10" fill="#756f55"/><path d="M52 47 76 5q5-5 11 0t3 9L63 53Z" fill="#a78d60" stroke="#89734f"/></svg>捣碎</button>
      <button type="button" class="tool" aria-pressed="false"><svg viewBox="0 0 120 75" aria-hidden="true"><path d="M23 38h74c-3 25-15 34-37 34S27 63 23 38Z" fill="#e9e5cc" stroke="#9a9f85"/><ellipse cx="60" cy="38" rx="37" ry="12" fill="#efebd4" stroke="#9a9f85"/><ellipse cx="60" cy="38" rx="28" ry="7" fill="#8b9770"/><path d="m76 29 26-24" stroke="#8f7750" stroke-width="6" stroke-linecap="round"/></svg>腌制</button>
    </section>
    <section class="amounts" aria-label="用量匙选择用量">
      <button type="button" class="spoon" aria-pressed="false"><svg viewBox="0 0 75 35" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><ellipse cx="21" cy="17" rx="13" ry="9"/><path d="M34 17h35"/><ellipse cx="21" cy="18" rx="5" ry="3" fill="currentColor" stroke="none"/></svg>少许</button>
      <button type="button" class="spoon selected" aria-pressed="true"><svg viewBox="0 0 75 35" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><ellipse cx="21" cy="17" rx="13" ry="9"/><path d="M34 17h35"/><ellipse cx="21" cy="17" rx="9" ry="5" fill="currentColor" stroke="none"/></svg>适量</button>
      <button type="button" class="spoon" aria-pressed="false"><svg viewBox="0 0 75 35" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><ellipse cx="21" cy="17" rx="13" ry="9"/><path d="M34 17h35"/><ellipse cx="21" cy="16" rx="12" ry="8" fill="currentColor" stroke="none"/></svg>大量</button>
    </section>
    <div class="burner" aria-hidden="true"><div class="grate"></div></div><p class="pot-label"><span>✓</span>备料 → 下锅 → 烹饪 → 出锅</p>
    <figure class="pot"><img src="assets/dish.jpg" alt="刚煮好的成菜仍在铸铁锅里，窗光、长辈和笑脸已经融成一张新照片"><div class="rim" aria-hidden="true"></div></figure>
    <svg class="steam" viewBox="0 0 158 156" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M28 149C-2 109 61 85 33 32M76 137c-25-36 40-64 10-108M125 149c-25-34 29-53 9-89"/></svg>
    <p class="pot-name"><small>这道菜叫</small>把午后煮暖 <button type="button" class="text-btn">改菜名 ↗</button></p>
    <div class="cloth" aria-hidden="true"></div><p class="plate-title"><small>刚出锅，还热着。</small>把午后煮暖</p><figure class="plate"><img src="assets/dish.jpg" alt="盛入白瓷盘里的新记忆，作为本锅成菜的装盘示意"></figure>
    <svg class="serve-arrow" viewBox="0 0 113 89" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M5 79Q29 9 103 23" stroke-dasharray="4 5"/><path d="m94 12 10 11-13 7"/></svg><p class="serve-note">从锅里，端出来。</p>
    <section class="heat" aria-label="用火苗数量选择火候">
      <button type="button" class="selected" aria-pressed="true"><span class="flames"><svg><use href="#flame"/></svg></span><span>文火</span></button><button type="button" aria-pressed="false"><span class="flames"><svg><use href="#flame"/></svg><svg><use href="#flame"/></svg></span><span>中火</span></button><button type="button" aria-pressed="false"><span class="flames"><svg><use href="#flame"/></svg><svg><use href="#flame"/></svg><svg><use href="#flame"/></svg></span><span>大火</span></button>
    </section>
    <section class="methods" aria-label="用厨具选择烹饪方式">
      <button type="button" class="method selected" aria-pressed="true"><svg viewBox="0 0 43 33" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M8 13h27v16H8zM5 16h3m27 0h3M6 10h31M18 7h7M14 5q-4-3 0-5m15 5q-4-3 0-5"/></svg>炖</button>
      <button type="button" class="method" aria-pressed="false"><svg viewBox="0 0 43 33" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M4 15h30c-2 17-27 17-30 0Zm30 0 8-9M14 9l3-6m7 7 4-6"/></svg>炒</button>
      <button type="button" class="method" aria-pressed="false"><svg viewBox="0 0 43 33" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M7 13h29v17H7zM7 21h29M6 10q15-16 31 0H6ZM21 3V0M14 16v2m8-2v2m7-2v2"/></svg>蒸</button>
      <button type="button" class="method" aria-pressed="false"><svg viewBox="0 0 43 33" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M6 3h31v27H6zM6 10h31M11 15h21v10H11zM12 6h2m6 0h2m6 0h2"/></svg>烤</button>
      <button type="button" class="method" aria-pressed="false"><svg viewBox="0 0 43 33" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M5 18h33c-3 17-30 17-33 0ZM21 16Q4 15 7 2q16 0 14 14Zm2 0Q19 2 36 1q3 13-13 15Z"/></svg>生拌</button>
    </section>
    <button type="button" class="switch" aria-label="开火，再煮一次">开火</button><p class="switch-label">文火炖 · 已出锅</p>
    <button type="button" class="save">收好这道菜 · 保存 ↓</button><aside class="return-tag"><button type="button">↶ 放回锅里，继续煮</button><small>做好的记忆，也是一味新食材。</small></aside><button type="button" class="again">＋ 再来一锅</button>
    <div class="history"><img src="assets/dish.jpg" alt="做过的菜的缩略图"><button type="button">做过的菜 · 01 道 / 回看 ↗</button></div>
    <footer><span>刀是切片，杵是捣碎，碗是腌制。凭手感来。</span><span>MEMORY KITCHEN / A TABLE FULL OF MEMORIES</span></footer>
  </main>
</body>
</html>
